name: Copilot CLI Check

on:
  schedule:
    - cron: '0 15 * * *' # 00:00 PM JST is 15:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js environment
        uses: actions/setup-node@v7

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Update Copilot CLI
        run: copilot update

      - name: Write Copilot CLI version to file
        run: copilot --version > copilot-version.txt

      - name: Display Copilot CLI version
        run: cat copilot-version.txt

      - name: Write Copilot CLI help to file
        run: copilot --help > copilot-help.txt

      - name: Display Copilot CLI help
        run: cat copilot-help.txt

      - name: Commit Copilot CLI version and create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add copilot-version.txt copilot-help.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          branch="copilot-cli-update-${{ github.run_id }}"
          git switch -c "$branch"
          git commit -m "Update Copilot CLI version"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update Copilot CLI version" \
            --body "Automated Copilot CLI version and help update."
